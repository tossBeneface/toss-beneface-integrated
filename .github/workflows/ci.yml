name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TossBeneface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run Gradle tests
        run: ./gradlew test

  fastapi-rust:
    name: FastAPI + Rust Engine Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastApi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastApi/requirements.txt

      - name: Set up Rust
        run: rustup update stable

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest maturin "psycopg[binary]==3.3.3" prometheus-client==0.20.0

      - name: Build Rust PyO3 wheel
        run: |
          rm -rf rust/card_benefit_engine/target/wheels
          python -m maturin build --manifest-path rust/card_benefit_engine/Cargo.toml --release --interpreter python

      - name: Install Rust PyO3 wheel
        run: python -m pip install "$(find rust/card_benefit_engine/target/wheels -maxdepth 1 -name '*.whl' | head -n 1)"

      - name: Verify Rust module import
        run: |
          python - <<'PY'
          import json
          import card_benefit_rust

          candidates = [{
              "card_name": "Toss Beneface Card",
              "card_company": "Toss Bank",
              "shop": "스타벅스",
              "summary": "스타벅스 50% 할인",
              "benefit": 50,
              "limit_once": 0,
              "limit_month": 0,
              "min_pay": 1000,
              "min_per": 0,
              "monthly": 0,
              "last_per": 100000,
              "now_per": 0,
              "monthly_split": 0,
              "accrue_benefit": 0,
              "visit_count": 0,
          }]
          payload = card_benefit_rust.analyze_best_benefit(json.dumps(candidates, ensure_ascii=False), 10000)
          result = json.loads(payload)
          assert result["best_card_name"] == "Toss Beneface Card"
          assert result["total_potential_benefit"] == 5000

          stores = [{"store_name": "스타벅스", "amount": 10000, "visit_count": 2}]
          batch_payload = card_benefit_rust.analyze_batch_benefits_from_candidates(
              json.dumps(stores, ensure_ascii=False),
              json.dumps(candidates, ensure_ascii=False),
          )
          batch_result = json.loads(batch_payload)["results"][0]
          assert batch_result["best_card_name"] == "Toss Beneface Card"
          assert batch_result["total_potential_benefit"] == 5500
          PY

      - name: Run FastAPI tests
        run: pytest -q

      - name: Rust performance smoke test
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from tests.benchmark_batch_engine import run_batch_benchmark

          # CI용 소규모 데이터셋: 20 stores x 5 cards, 30회 반복
          # 목적: Rust가 Python 대비 최소 2x 이상 빠른지 자동 검증
          MIN_SPEEDUP = 2.0
          result = run_batch_benchmark(card_count=5, store_count=20, iterations=30, seed=42)

          speedup = result["speedup"]
          py_ms   = result["python_avg_ms"]
          rs_ms   = result["rust_avg_ms"]

          print(f"\n[Smoke] Python avg: {py_ms:.4f}ms  Rust avg: {rs_ms:.4f}ms  Speedup: {speedup:.2f}x")
          print(f"[Smoke] Minimum required speedup: {MIN_SPEEDUP}x")

          if speedup < MIN_SPEEDUP:
              print(f"FAIL: Rust speedup {speedup:.2f}x < {MIN_SPEEDUP}x — performance regression detected")
              sys.exit(1)

          print(f"PASS: Rust is {speedup:.2f}x faster than Python")
          PY
