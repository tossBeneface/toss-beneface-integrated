syntax = "proto3";

package com.app.grpc;

// 개별 매장 분석 요청
message StoreRequest {
  string store_name = 1;
  string category = 2;
  int32 amount = 3;
}

// 배치 매장 분석 요청
message BatchBenefitRequest {
  int64 member_id = 1;
  repeated StoreRequest stores = 2;
}

// 카드 혜택 분석 요청 (단일)
message BenefitAnalysisRequest {
  int64 member_id = 1;
  string store_name = 2;
  string category = 3;
  int32 amount = 4;
}

// 개별 카드 혜택 정보
message CardBenefitResult {
  string card_name = 1;
  int32 discount_amount = 2;
  string benefit_type = 3; // 할인, 적립, 캐시백 등
  string description = 4;
}

// 개별 매장 결과
message StoreBenefitResult {
  string store_name = 1;
  string best_card_name = 2;
  int32 total_potential_benefit = 3;
}

// 카드 혜택 분석 응답 (단일)
message BenefitAnalysisResponse {
  string best_card_name = 1;
  int32 total_potential_benefit = 2;
  repeated CardBenefitResult all_options = 3;
}

// 배치 분석 응답
message BatchBenefitResponse {
  repeated StoreBenefitResult results = 1;
}

// 카드 혜택 분석 서비스 정의
service CardBenefitService {
  rpc AnalyzeBestBenefit(BenefitAnalysisRequest) returns (BenefitAnalysisResponse);
  rpc AnalyzeBatchBenefits(BatchBenefitRequest) returns (BatchBenefitResponse);
}
