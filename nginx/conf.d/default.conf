# ─────────────────────────────────────────────
# Spring Boot upstream
# 실제 운영 시 backend_1, backend_2... 추가해 수평 확장
# ─────────────────────────────────────────────
upstream spring_backend {
    least_conn;                          # 활성 연결이 가장 적은 서버로 분배
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;                        # upstream 커넥션 재사용
}

# ─────────────────────────────────────────────
# FastAPI upstream (AI 처리 서버)
# ─────────────────────────────────────────────
upstream fastapi_backend {
    least_conn;
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Rate Limiting 적용 (burst: 순간 최대 50 요청 허용)
    limit_req zone=api_limit burst=50 nodelay;

    # ─────────────────────────────────────────
    # Spring Boot API
    # ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";           # keepalive 활성화

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 업스트림 장애 시 다음 서버로 재시도
        proxy_next_upstream error timeout http_500 http_502 http_503;
    }

    # ─────────────────────────────────────────
    # WebSocket (음성 처리 결과 푸시용)
    # ─────────────────────────────────────────
    location /ws/ {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;                # WebSocket 연결 유지
    }

    # ─────────────────────────────────────────
    # FastAPI (AI 서비스)
    # ─────────────────────────────────────────
    location /fastapi/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;                 # AI 처리 대기 시간 고려
    }

    # ─────────────────────────────────────────
    # Actuator (내부 모니터링 — 외부 접근 차단)
    # ─────────────────────────────────────────
    location /actuator/ {
        allow 172.0.0.0/8;                       # Docker 내부 네트워크만 허용
        deny all;
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─────────────────────────────────────────
    # 헬스체크 엔드포인트
    # ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
