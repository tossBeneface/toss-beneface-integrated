global:
  resolve_timeout: 5m
  slack_api_url: '__SLACK_WEBHOOK_URL__'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '__SLACK_CHANNEL__'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] TossBeneface 시스템 알림'
        text: >-
          {{ range .Alerts }}
            *알림명:* {{ .Annotations.summary }}
            *심각도:* {{ .Labels.severity }}
            *상세내용:* {{ .Annotations.description }}
            *발생시간:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
