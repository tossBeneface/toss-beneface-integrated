# 인스턴스 A (infra + backend#1) — c7i-flex.large
# 사용: docker compose -f deploy/compose-a.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: beneface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toss_beneface
      POSTGRES_USER: toss_beneface_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai0310}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toss_beneface_user -d toss_beneface"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: beneface-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: beneface-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # EXTERNAL은 인스턴스 B가 사설 IP로 접속하는 리스너
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${PRIVATE_IP_A:-172.31.58.237}:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: beneface-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../kafka/scripts:/scripts
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    restart: "no"

  # 풀 FastAPI: HTTP(8000, 얼굴인식/OCR/음성/분석) + gRPC(50051, 혜택 분석) 통합 프로세스
  # 빠른 반복이 필요하면 grpc.Dockerfile 기반 슬림 이미지로 대체 가능
  fastapi:
    build:
      context: ../fastApi
      dockerfile: dockerfile
    image: beneface-fastapi:latest
    container_name: beneface-fastapi
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: toss_beneface_user
      DB_PASSWORD: ${DB_PASSWORD:-ai0310}
      DB_NAME: toss_beneface
      DB_HOST_LOCAL: postgres
      DB_USER_LOCAL: toss_beneface_user
      DB_PASSWORD_LOCAL: ${DB_PASSWORD:-ai0310}
      DB_NAME_LOCAL: toss_beneface
      SPRING_API_URL: http://backend:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"     # 인스턴스 B의 backend#2가 사설 IP로 접속 (SG 내부 트래픽만 허용됨)
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../TossBeneface
    image: tossbeneface-backend:latest
    container_name: beneface-backend-1
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/toss_beneface
      SPRING_DATASOURCE_USERNAME: toss_beneface_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ai0310}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      APP_OUTBOX_PUBLISHER_ENABLED: "true"   # outbox 발행은 A에서만 (중복 발행 방지)
      FAST_API_HOST: http://fastapi:8000
      # 하이픈 포함 속성이라 relaxed binding 대신 JSON으로 명시
      SPRING_APPLICATION_JSON: '{"grpc":{"client":{"card-benefit-service":{"address":"static://fastapi:50051"}}}}'
      TOKEN_SECRET: ${TOKEN_SECRET:-ec2-demo-token-secret-for-beneface-2026-keep-this-over-sixty-four-characters-long}
      AWS_ACCESS_KEY: demo-access-key
      AWS_SECRET_KEY: demo-secret-key
      TOSS_TEST_CLIENT_API_KEY: test-client-key
      TOSS_TEST_SECRET_API_KEY: test-secret-key
      TOSS_SUCCESS_URL: http://localhost/api/payment/success
      TOSS_FAIL_URL: http://localhost/api/payment/fail
      JAVA_TOOL_OPTIONS: -Xmx1024m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  front:
    image: nginx:1.25-alpine
    container_name: beneface-front
    restart: unless-stopped
    volumes:
      - ../front-build:/usr/share/nginx/html:ro
      - ./nginx-front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"   # ALB front 타깃 그룹이 8081로 라우팅

volumes:
  postgres-data:
  redis-data:
