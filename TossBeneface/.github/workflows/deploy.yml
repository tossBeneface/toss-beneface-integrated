name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  APP_RUNTIME_SECRET_ID: ${{ vars.APP_RUNTIME_SECRET_ID }}
  APP_DEPLOY_SECRET_ID: ${{ vars.APP_DEPLOY_SECRET_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run backend tests
        run: |
          bash ./gradlew test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}

      - name: Fetch app runtime secret
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "$APP_RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > runtime-secret.json

      - name: Fetch deploy secret
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "$APP_DEPLOY_SECRET_ID" \
            --query SecretString \
            --output text > deploy-secret.json

      - name: Export deploy secret values
        run: |
          bash .github/scripts/export-secret-to-github-env.sh \
            deploy-secret.json \
            "$GITHUB_ENV" \
            DOCKER_USERNAME \
            DOCKER_PASSWORD \
            EC2_HOST \
            EC2_PRIVATE_KEY

      - name: Render runtime env file
        run: |
          bash .github/scripts/render-runtime-env.sh runtime-secret.json runtime.env prod

      - name: Build Docker image
        run: |
          docker build -t ${DOCKER_USERNAME}/toss-beneface:latest .

      - name: Push Docker image to Docker Hub
        run: |
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
          docker push ${DOCKER_USERNAME}/toss-beneface:latest

      - name: Restore key.pem
        run: |
          echo "${EC2_PRIVATE_KEY}" | base64 -d > key.pem
          chmod 400 key.pem

      - name: Copy runtime env to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem runtime.env ubuntu@${EC2_HOST}:/home/ubuntu/toss-beneface.env

      - name: Deploy to EC2
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${EC2_HOST} <<EOF
          docker pull ${DOCKER_USERNAME}/toss-beneface:latest
          docker stop toss-beneface || true
          docker rm toss-beneface || true
          docker run -d --name toss-beneface -p 8080:8080 --env-file /home/ubuntu/toss-beneface.env ${DOCKER_USERNAME}/toss-beneface:latest
          EOF
