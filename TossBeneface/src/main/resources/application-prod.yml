spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 500
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

token:
  secret: ${TOKEN_SECRET}

cookie:
  encryption:
    secret: ${COOKIE_ENCRYPTION_SECRET}

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY}
      secretKey: ${AWS_SECRET_KEY}

payment:
  toss:
    test_client_api_key: ${TOSS_TEST_CLIENT_API_KEY}
    test_secret_api_key: ${TOSS_TEST_SECRET_API_KEY}
    success_url: ${TOSS_SUCCESS_URL}
    fail_url: ${TOSS_FAIL_URL}

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}

logging:
  level:
    com.app: info # todo 패키지 수정
