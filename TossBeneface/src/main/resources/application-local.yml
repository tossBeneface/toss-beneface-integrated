spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toss_beneface}
    username: ${SPRING_DATASOURCE_USERNAME:toss_beneface_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ai0310}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Flyway가 스키마를 관리하므로 validate로 변경
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 500
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    # Local host execution should not assume Docker-network hostnames such as `kafka`.
    # Override this when a host-reachable Kafka broker is available.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Default off for local host execution.
      # Turn on explicitly when Kafka is reachable from the host, e.g.
      # SPRING_KAFKA_LISTENER_AUTO_STARTUP=true
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                    # 모든 ISR 확인 후 응답 → 메시지 유실 방지
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest  # 처음 조인 시 가장 오래된 메시지부터 소비
      enable-auto-commit: false    # 수동 커밋 → 처리 성공 후에만 offset 이동
      properties:
        spring.json.trusted.packages: "com.app.*"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

grpc:
  client:
    card-benefit-service:
      address: 'static://localhost:50051'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

token:
  secret: ${TOKEN_SECRET:local-token-secret-for-beneface-development-environment-2026-keep-this-over-sixty-four-characters}

cookie:
  encryption:
    secret: ${COOKIE_ENCRYPTION_SECRET:local-cookie-encryption-key-2026}

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY:local-access-key}
      secretKey: ${AWS_SECRET_KEY:local-secret-key}

payment:
  toss:
    test_client_api_key: ${TOSS_TEST_CLIENT_API_KEY:test-client-key}
    test_secret_api_key: ${TOSS_TEST_SECRET_API_KEY:test-secret-key}
    success_url: ${TOSS_SUCCESS_URL:http://localhost/api/payment/success}
    fail_url: ${TOSS_FAIL_URL:http://localhost/api/payment/fail}

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
