spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

token:
  secret: test-token-secret-for-beneface-integration-tests-2026-keep-this-over-sixty-four-characters

cookie:
  encryption:
    secret: test-cookie-encryption-key-2026x

cloud:
  aws:
    credentials:
      accessKey: test-access-key
      secretKey: test-secret-key

payment:
  toss:
    test_client_api_key: test-client-key
    test_secret_api_key: test-secret-key
    success_url: http://localhost:8080/api/payment/success
    fail_url: http://localhost:8080/api/payment/fail
